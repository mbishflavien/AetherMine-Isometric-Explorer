name: Bug report
description: Report a rendering, interaction, or accessibility problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Screenshots of the console panel help with rendering issues.

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Focus the shallow layer
        3. Click the GPR lens
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 132, Chrome 131, Safari 18
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Paste any errors from the developer console.
      render: shell
